<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>芒格工作法</title>
<meta name="description" content="芒格工作法：AI 时代的个人成长笔记。">
<style>
  :root {
    --bg: #fafaf7;
    --ink: #1a1a1f;
    --ink-soft: #5a5a64;
    --rule: #e4e2dc;
    --accent: #1f4e79;
    --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", Charter, Georgia, serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111114;
      --ink: #ededf0;
      --ink-soft: #a3a3ad;
      --rule: #2a2a31;
      --accent: #8db8e3;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111114;
    --ink: #ededf0;
    --ink-soft: #a3a3ad;
    --rule: #2a2a31;
    --accent: #8db8e3;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); color: var(--ink); }
  body {
    margin: 0 auto;
    max-width: 40rem;
    padding: 5rem 1.25rem 3rem;
    font: 17px/1.8 var(--sans);
    background: var(--bg);
  }
  header { border-bottom: 1px solid var(--rule); padding-bottom: 2rem; }
  h1 { font: 600 2.4rem/1.2 var(--serif); letter-spacing: .02em; margin: 0; }
  .tagline { color: var(--ink-soft); font-size: 1.1rem; margin: .75rem 0 0; }
  .lede { margin: 2rem 0 0; }
  h2 {
    font: 600 .85rem/1 var(--sans);
    letter-spacing: .12em;
    color: var(--ink-soft);
    margin: 3rem 0 1rem;
  }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: .9rem 0; border-bottom: 1px solid var(--rule); }
  li:first-child { border-top: 1px solid var(--rule); }
  li strong { display: block; font: 600 1.05rem/1.5 var(--serif); }
  li span { color: var(--ink-soft); font-size: .95rem; }
  .note { color: var(--ink-soft); }
  a { color: var(--accent); text-underline-offset: .2em; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  footer {
    margin-top: 4rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    font-size: .85rem;
    color: var(--ink-soft);
  }
  footer p { margin: .25rem 0; }
  @media (max-width: 30rem) {
    body { padding-top: 3rem; }
    h1 { font-size: 2rem; }
  }
</style>
</head>
<body>
  <header>
    <h1>芒格工作法</h1>
    <p class="tagline">AI 时代的个人成长</p>
    <p class="lede">这里是一份个人学习笔记：记录我如何借助 AI 读书、思考、做决定，以及在这个过程中慢慢长出来的方法。</p>
  </header>

  <main>
    <h2>关注的主题</h2>
    <ul>
      <li><strong>多元思维模型</strong><span>从不同学科借来的思考工具，用来看清问题、少犯错。</span></li>
      <li><strong>用 AI 学习</strong><span>把 AI 当成陪练和研究助手：提问、追问、复盘。</span></li>
      <li><strong>决策与复盘</strong><span>记录重要决定的依据，事后对照结果，修正判断。</span></li>
      <li><strong>长期主义</strong><span>阅读、健康、习惯——那些需要时间复利的事。</span></li>
    </ul>

    <h2>近况</h2>
    <p class="note">笔记正在整理中，会陆续放在这里。</p>
  </main>

  <footer>
    <p>© <span id="year">2026</span> 芒格工作法 · 个人学习笔记</p>
    <p>名称致敬查理·芒格的多元思维模型，与芒格本人及其相关机构无关。</p>
  </footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
